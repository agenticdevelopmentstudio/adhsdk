name: AgenticDeveloperHubSDKApp
options:
  bundleIdPrefix: com.mikefullerton.agenticdeveloperhubsdk
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "2640"

settings:
  base:
    SWIFT_VERSION: "6.3"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: macosx
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    DEVELOPMENT_TEAM: K2NA732JAX
    ENABLE_MODULE_VERIFIER: YES
    ENABLE_TESTABILITY: YES
    MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
    PRODUCT_NAME: $(TARGET_NAME)
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    # One clang module cache per machine, not one per DerivedData folder:
    # implicit modules (above) are keyed by hash and lock-safe to share.
    MODULE_CACHE_DIR: $(HOME)/Library/Developer/Xcode/SharedModuleCache
    LD_RUNPATH_SEARCH_PATHS:
      - $(inherited)
      - "@executable_path/../Frameworks"

projectReferences:
  AgenticDeveloperHubSDK:
    path: ../AgenticDeveloperHubSDK/AgenticDeveloperHubSDK.xcodeproj

targetTemplates:
  SwiftLint:
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          if which swiftlint >/dev/null; then
            swiftlint lint --quiet --strict
          else
            echo "warning: SwiftLint not installed; brew install swiftlint to enable"
          fi

targets:
  AgenticDeveloperHubSDKApp:
    type: application
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - path: AgenticDeveloperHubSDKApp
        excludes:
          - "Info.plist"
          - "AgenticDeveloperHubSDKApp.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.agenticdeveloperhubsdk.app
        INFOPLIST_FILE: AgenticDeveloperHubSDKApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: AgenticDeveloperHubSDKApp/AgenticDeveloperHubSDKApp.entitlements
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDKCore
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDKCoreUI
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDKCoreMacOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDKMacOS
        embed: true
        codeSign: true
      # AgenticDeveloperHubSDKMacOS links it (WindowManager's screen identity,
      # matching and change detection), so the host must embed it.
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDKDisplays
        embed: true
        codeSign: true
      # Embedded so the framework loads into the host process; each .aiplugin
      # links it without embedding and resolves to this one loaded image at dlopen.
      - target: AgenticDeveloperHubSDK/AIPluginKit
        embed: true
        codeSign: true

  AgenticDeveloperHubSDKAppTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - AgenticDeveloperHubSDKAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.agenticdeveloperhubsdk.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AgenticDeveloperHubSDKApp.app/Contents/MacOS/AgenticDeveloperHubSDKApp
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
    dependencies:
      - target: AgenticDeveloperHubSDKApp
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDKCoreUI
        embed: true
        codeSign: true

schemes:
  AgenticDeveloperHubSDKApp:
    build:
      targets:
        AgenticDeveloperHubSDKApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenticDeveloperHubSDKAppTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
