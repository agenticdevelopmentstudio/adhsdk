name: AgenticDeveloperHubSDKSampleApp
options:
  bundleIdPrefix: com.mikefullerton.AgenticDeveloperHubSDK
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "17.0"
    visionOS: "1.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "Agentic Developer Hub SDK"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

projectReferences:
  AgenticDeveloperHubSDK:
    path: ../AgenticDeveloperHubSDK/AgenticDeveloperHubSDK.xcodeproj

targets:
  AgenticDeveloperHubSDKSampleApp-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperHubSDK.macos
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools

  AgenticDeveloperHubSDKSampleApp-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDKUI-iOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDK/AgenticDeveloperHubSDK-iOS
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperHubSDK.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  AgenticDeveloperHubSDKSampleApp-watchOS:
    type: application
    platform: watchOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperHubSDK.watchos
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES

  AgenticDeveloperHubSDKSampleApp-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperHubSDK.tvos

  AgenticDeveloperHubSDKSampleApp-visionOS:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikefullerton.AgenticDeveloperHubSDK.visionos
        TARGETED_DEVICE_FAMILY: "7"

schemes:
  AgenticDeveloperHubSDKSampleApp-macOS:
    build:
      targets:
        AgenticDeveloperHubSDKSampleApp-macOS: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  AgenticDeveloperHubSDKSampleApp-iOS:
    build:
      targets:
        AgenticDeveloperHubSDKSampleApp-iOS: all
    run:
      config: Debug
  AgenticDeveloperHubSDKSampleApp-watchOS:
    build:
      targets:
        AgenticDeveloperHubSDKSampleApp-watchOS: all
    run:
      config: Debug
  AgenticDeveloperHubSDKSampleApp-tvOS:
    build:
      targets:
        AgenticDeveloperHubSDKSampleApp-tvOS: all
    run:
      config: Debug
  AgenticDeveloperHubSDKSampleApp-visionOS:
    build:
      targets:
        AgenticDeveloperHubSDKSampleApp-visionOS: all
    run:
      config: Debug
