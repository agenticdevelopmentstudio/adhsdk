        product: HTTPTypes
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    settings:
      base:
        SDKROOT: iphoneos
        PRODUCT_NAME: AgenticDeveloperHubSDKHubAuth
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  # Split for the same reason as HTDV, which it depends on. HubError lives in
  # AgenticDeveloperHubSDKHubAuth, which this re-exports (HubAuthReExports.swift).
  AgenticDeveloperHubSDKHub-macOS:
    type: framework
    platform: macOS
    templates: [SwiftLint]
    sources:
      - Hub
    dependencies:
      - target: AgenticDeveloperHubSDKHTDV-macOS
      - target: AgenticDeveloperHubSDKHubAuth-macOS
    settings:
      base:
        PRODUCT_NAME: AgenticDeveloperHubSDKHub
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  AgenticDeveloperHubSDKHub-iOS:
    type: framework
    platform: iOS
    templates: [SwiftLint]
    sources:
      - Hub
    dependencies:
      - target: AgenticDeveloperHubSDKHTDV-iOS
      - target: AgenticDeveloperHubSDKHubAuth-iOS
    settings:
      base:
        SDKROOT: iphoneos
        PRODUCT_NAME: AgenticDeveloperHubSDKHub
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"

  AgenticDeveloperHubSDKHubTests:
    type: bundle.unit-test
    platform: macOS
    templates: [SwiftLint]
    sources:
      - Tests/AgenticDeveloperHubSDKHubTests
    dependencies:
      - target: AgenticDeveloperHubSDKHub-macOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKHubAuth-macOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKHTDV-macOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubAuth
