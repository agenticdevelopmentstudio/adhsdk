name: AgenticDeveloperHubSDK
options:
  bundleIdPrefix: com.mikefullerton.agenticdeveloperhubsdk
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: false
  xcodeVersion: "2640"

settings:
  base:
    SWIFT_VERSION: "6.4"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SDKROOT: macosx
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_TESTABILITY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_MODULE_VERIFIER: YES
    GENERATE_INFOPLIST_FILE: YES
    MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_ENABLE_EXPLICIT_MODULES: NO
    # One clang module cache per machine, not one per DerivedData folder:
    # implicit modules (above) are keyed by hash and lock-safe to share.
    MODULE_CACHE_DIR: $(HOME)/Library/Developer/Xcode/SharedModuleCache
    LM_FILTER_WARNINGS: YES
    OTHER_LDFLAGS: "$(inherited) -weak_framework AppIntents"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    PRODUCT_NAME: $(TARGET_NAME)

targetTemplates:
  SwiftLint:
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          if which swiftlint >/dev/null; then
            swiftlint lint --quiet --strict
          else
            echo "warning: SwiftLint not installed; brew install swiftlint to enable"
          fi

projectReferences:
  # The generated hub API client: a sibling project in this same
  # packages/apple/, never a copy elsewhere, so a workspace that also lists
  # it reaches it by the SAME path and does not build it twice.
  AgenticDeveloperHubClient:
    path: ../AgenticDeveloperHubClient/AgenticDeveloperHubClient.xcodeproj

packages:
  # Vendored: upstream's git history holds ~100 copies of a 34 MB binary, so
  # every build folder cloned 3.2 GB. A local package of the same identity also
  # replaces CodeEditSourceEditor's own dependency. See Vendor/CodeEditLanguages/README.md.
  CodeEditLanguages:
    path: Vendor/CodeEditLanguages
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor.git
    minVersion: "0.15.2"
    maxVersion: "1.0.0"
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # TerminalSession reads Terminal.totalLinesTrimmed, which 1.13 and 1.14 lack.
    # 1.99 is the 2.0 API (no getTerminal(), dataReceived(slice:) unavailable), which
    # the terminal views do not build against, so the range stops before it.
    minVersion: "1.20.0"
    maxVersion: "1.99.0"
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: "0.20.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
  # Semantic search on the device (SemanticSearchStore): the ONNX Runtime
  # that runs the embedding model, and the tokenizer that reads the bundle's
  # pinned tokenizer.json (reached through SharedRuntime). Both exact: the parity spike proved these
  # versions against the golden set, and a change re-runs it.
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    exactVersion: "1.24.2"
  # MCP (Core) and swift-transformers' Tokenizers (SemanticSearchStore) both reach
  # EventSource and NIO. Linked straight into two frameworks, each carries its own
  # copy and dyld reports the classes implemented in both. This local package is one
  # dynamic library holding them, linked by both. See SharedRuntime/Package.swift.
  SharedRuntime:
    path: SharedRuntime
  JSONRPC:
    url: https://github.com/ChimeHQ/JSONRPC
    from: "0.9.2"
  LanguageServerProtocol:
    url: https://github.com/ChimeHQ/LanguageServerProtocol
    from: "0.14.1"
  LanguageClient:
    url: https://github.com/ChimeHQ/LanguageClient
    from: "0.8.2"
  swift-openapi-runtime:
    url: https://github.com/apple/swift-openapi-runtime
    minVersion: "1.12.0"
    maxVersion: "2.0.0"
  swift-http-types:
    url: https://github.com/apple/swift-http-types
    minVersion: "1.0.0"
    maxVersion: "2.0.0"
  swift-openapi-urlsession:
    url: https://github.com/apple/swift-openapi-urlsession
    minVersion: "1.3.0"
    maxVersion: "2.0.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
  AppAuth:
    url: https://github.com/openid/AppAuth-iOS
    from: "3.0.0"

settingGroups:
  # The targets that were the AgenticDeveloperHubSDK project until Phase 5
  # folded it in. They build in Swift 6 language mode with complete
  # concurrency checking like everything else; warnings stay warnings.
  PersonaSettings:
    SWIFT_VERSION: "6.4"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_MODULE_VERIFIER: NO
    DEFINES_MODULE: YES
    SKIP_INSTALL: YES
    MARKETING_VERSION: "0.1.0"
    STRING_CATALOG_GENERATE_SYMBOLS: NO

targets:
  AIPluginKit:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - AIPluginKit
    dependencies:
      - target: AgenticDeveloperHubSDKCore

  AgenticDeveloperHubSDKCore:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - path: Core
      - path: macOS/Features/AIChatWindow/ChatBackend.swift
        group: Core
    dependencies:
      - package: SharedRuntime
        product: ADHSharedRuntime
      - target: AgenticDeveloperHubSDK-macOS

  AgenticDeveloperHubSDKLanguage:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Language
    dependencies:
      - target: AgenticDeveloperHubSDKCore
      - package: JSONRPC
        product: JSONRPC
      - package: LanguageServerProtocol
        product: LanguageServerProtocol
      - package: LanguageClient
        product: LanguageClient
      - sdk: JavaScriptCore.framework
    # Daemon-safe: text documents, language-server plumbing and the TextMate
    # syntax highlighter. Foundation, JavaScriptCore and the ChimeHQ LSP stack
    # only; no AppKit. The AppKit face of a TextDocument
    # is TextDocumentStorage in AgenticDeveloperHubSDKMacOS, mirroring the
    # SemanticPalette / SemanticPalette+NSColor split.

  AgenticDeveloperHubSDKCoreUI:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - CoreUI
    dependencies:
      - target: AgenticDeveloperHubSDKCore

  AgenticDeveloperHubSDKCoreMacOS:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - path: CoreMacOS
      - path: macOS/UI/Settings/SettingStorage/RGBAColor+NSColor.swift
        group: CoreMacOS
    dependencies:
      - target: AgenticDeveloperHubSDKCore
      - target: AgenticDeveloperHubSDKCoreUI
      # The AppKit half of the theme model (`palette.nsColor(_:)`,
      # `palette.font(_:)`, the Themed* views) lives in
      # AgenticDeveloperHubSDKUI, not in the Foundation-only
      # AgenticDeveloperHubSDK that AgenticDeveloperHubSDKCore re-exports.
      # SemanticPalette+SwiftUI.swift builds its Font from the NSFont one.
      - target: AgenticDeveloperHubSDKUI-macOS

  AgenticDeveloperHubSDKMacOS:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - path: macOS
        excludes:
          - "Features/AIChatWindow/ChatBackend.swift"
          - "Features/SessionWatcher/Old/OldSessionWindowPanelViewController.swift"
          - "Features/SessionWatcher/Old/OldSessionWindowSettingsPane.swift"
          # Whole folder, not just the one file it contains (built into
          # AgenticDeveloperHubSDKCoreMacOS instead, see that target's sources
          # above): excluding only the file left an empty "UI/Settings"
          # directory that XcodeGen still generated an orphaned PBXGroup
          # for despite generateEmptyDirectories: false, causing spurious
          # TEMP_ UUID churn in project.pbxproj on every regeneration.
          - "UI/Settings"
          - "Scripting"
          - "Features/BrowserPane/Automation/BrowserSnapshot.js"
          - "Features/BrowserPane/BrowserActivationShield.js"
          - "Features/BrowserPane/BrowserPageWordFilter.js"
      - path: macOS/Features/BrowserPane/Automation/BrowserSnapshot.js
        buildPhase: resources
      - path: macOS/Features/BrowserPane/BrowserActivationShield.js
        buildPhase: resources
      - path: macOS/Features/BrowserPane/BrowserPageWordFilter.js
        buildPhase: resources
    dependencies:
      - package: SharedRuntime
        product: ADHSharedRuntime
      - target: AgenticDeveloperHubSDKCore
      - target: AgenticDeveloperHubSDKCoreUI
      - target: AgenticDeveloperHubSDKCoreMacOS
      - target: AgenticDeveloperHubSDKPermissions
      - target: AgenticDeveloperHubSDKPermissionsUI
      - target: AgenticDeveloperHubSDKDisplays
      - target: AgenticDeveloperHubSDKScripting
      - target: AIPluginKit
      - target: AgenticDeveloperHubSDKLanguage
      - target: AgenticDeveloperHubSDKUI-macOS
      - target: AgenticDeveloperHubSDKMarkdown-macOS
      - target: AgenticDeveloperHubSDKDatabase
      - target: AgenticDeveloperHubSDKIntegrations
      # `BrowserHistoryStore` sits on `BoundedDatabase` and reads GRDB rows.
      - package: GRDB
        product: GRDB
      - package: SwiftTerm
      - package: CodeEditSourceEditor
      - package: CodeEditLanguages
      - package: KeyboardShortcuts
      - package: Sparkle
      # `MCPHTTPEndpoint` owns the loopback socket through FlyingFox.
      - package: FlyingFox

  AgenticDeveloperHubSDKPermissions:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Permissions
    # Daemon-safe: Foundation + ApplicationServices (AX) + CoreServices (Apple
    # Events) + UserNotifications, all auto-linked via import. No AppKit.

  AgenticDeveloperHubSDKLaunch:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Launch
    dependencies:
      - target: AgenticDeveloperHubSDKCore

  AgenticDeveloperHubSDKLaunchUI:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - LaunchUI
    dependencies:
      - target: AgenticDeveloperHubSDKLaunch
      - target: AgenticDeveloperHubSDKCore
      - target: AgenticDeveloperHubSDKCoreUI
      - target: AgenticDeveloperHubSDKCoreMacOS
      - target: AgenticDeveloperHubSDKPermissions
      - target: AgenticDeveloperHubSDKPermissionsUI
    # AppKit presenter for LaunchManager: the undismissable progress panel.

  AgenticDeveloperHubSDKDisplays:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Displays
    dependencies:
      - sdk: ScreenCaptureKit.framework
      - sdk: ColorSync.framework
      - sdk: IOKit.framework

  # The Chrome Web Browser pane, over the Chromium Embedded Framework. A mixed
  # target: an Objective-C++ bridge (Chromium/Bridge, Chromium/Private) wraps
  # CEF's C++ API so the Swift half (Chromium/Sources) sees plain
  # Objective-C. `cef.py stage` puts CEF's headers and the
  # libcef_dll_wrapper.a it compiles in $(BUILT_PRODUCTS_DIR)/CEF before the
  # compile; CEF itself is loaded at runtime (cef_load_library), never linked,
  # and a host embeds it and the helper bundles with `cef.py embed`.
  AgenticDeveloperHubSDKChromium:
    type: framework
    platform: macOS
    sources:
      - path: Chromium/Bridge
        headerVisibility: public
      - path: Chromium/Private
        headerVisibility: project
      - Chromium/Sources
    preBuildScripts:
      - name: Stage CEF
        basedOnDependencyAnalysis: false
        script: |
          exec /usr/bin/python3 "$SRCROOT/../../../tools/apple/cef.py" stage \
            --dest "$BUILT_PRODUCTS_DIR/CEF" --archs "$ARCHS"
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          if which swiftlint >/dev/null; then
            swiftlint lint --quiet --strict
          else
            echo "warning: SwiftLint not installed; brew install swiftlint to enable"
          fi
    settings:
      base:
        DEFINES_MODULE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        GCC_ENABLE_CPP_RTTI: NO
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) NDEBUG=1 CEF_USE_SANDBOX=1"
        # A system path, so CEF's headers' warnings under Xcode's warning set
        # stay CEF's and warnings-as-errors still holds for this target's own
        # code. The module (the public headers) holds no C++.
        SYSTEM_HEADER_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/CEF"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(BUILT_PRODUCTS_DIR)/CEF/lib"
        OTHER_LDFLAGS: "$(inherited) -weak_framework AppIntents -lcef_dll_wrapper"
    dependencies:
      - target: AgenticDeveloperHubSDKCore
      - target: AgenticDeveloperHubSDKCoreUI
      - target: AgenticDeveloperHubSDKCoreMacOS
      - target: AgenticDeveloperHubSDKDatabase
      - target: AgenticDeveloperHubSDKMacOS

  AgenticDeveloperHubSDKPermissionsUI:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - PermissionsUI
    dependencies:
      - target: AgenticDeveloperHubSDKPermissions
      - target: AgenticDeveloperHubSDKCore
      - target: AgenticDeveloperHubSDKCoreMacOS
    # AppKit settings panel (toolkit convention: AppKit, not SwiftUI). No
    # ComposableSettings dependency — hosts wrap PermissionsPanelView themselves.

  AgenticDeveloperHubSDKSystemMonitor:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - SystemMonitor
    dependencies:
      - target: AgenticDeveloperHubSDKCore
    # Daemon-safe: what the machine is doing — disk, memory, CPU, and named
    # process groups (Docker, Ollama) — read through Foundation, libproc and
    # Mach. No AppKit; the window that shows it is AgenticDeveloperHubSDKSystemMonitorUI.

  AgenticDeveloperHubSDKSystemMonitorUI:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - SystemMonitorUI
    dependencies:
      - target: AgenticDeveloperHubSDKSystemMonitor
      - target: AgenticDeveloperHubSDKCore
      - target: AgenticDeveloperHubSDKMacOS
      - target: AgenticDeveloperHubSDKUI-macOS
    # The themed System Status window. AgenticDeveloperHubSDKMacOS for the window
    # controllers and the settings scroll host it reuses.

  AgenticDeveloperHubSDKMenuBar:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - MenuBar
    dependencies:
      - target: AgenticDeveloperHubSDKCore
    # The status-bar app driver for a daemon's menu bar app (StatusBarAppDelegate,
    # MenuComposer and the stock sections), formerly agenticdaemon's MenuBarKit.
    # AppKit only. It reads a daemon's /health through Core's DaemonHealthReport
    # and never links DaemonKit, so the daemon side stays free of UI.

  AgenticDeveloperHubSDKScripting:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - macOS/Scripting
    # AppKit + Foundation only: the NSScriptCommand main-actor base and the
    # AppleScript runner, so an app can be scriptable without linking the
    # whole of AgenticDeveloperHubSDKMacOS.

  AgenticDeveloperHubSDKNotifications:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    sources:
      - Notifications
    settings:
      base:
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Foundation only: the Notice model, its wire coding and filter predicate.
    # A daemon, a CLI and an iOS app can all link it.

  AgenticDeveloperHubSDKNotificationsTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticDeveloperHubSDKNotificationsTests
    dependencies:
      - target: AgenticDeveloperHubSDKNotifications
        embed: true
        codeSign: true

  AgenticDeveloperHubSDKNotificationsUI:
    type: framework
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - NotificationsUI
    dependencies:
      - target: AgenticDeveloperHubSDKNotifications
      - target: AgenticDeveloperHubSDKCore
      - target: AgenticDeveloperHubSDKCoreUI
      - target: AgenticDeveloperHubSDKMacOS
      - target: AgenticDeveloperHubSDKUI-macOS
      - sdk: UserNotifications.framework
      # `NoticeHotkeys` declares its chords as `KeyboardShortcuts.Shortcut`.
      - package: KeyboardShortcuts
    # AppKit: the presentation center that routes notices to presenters, the
    # non-activating NoticePanel, the card, and the toast and alert presenters.
    # AgenticDeveloperHubSDKMacOS for ComposableSettings and menu targets;
    # AgenticDeveloperHubSDKUI-macOS for ThemeManager and the themed views.

  AgenticDeveloperHubSDKNotificationsUITests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticDeveloperHubSDKNotificationsUITests
    dependencies:
      - package: KeyboardShortcuts
      - target: AgenticDeveloperHubSDKNotificationsUI
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKNotifications
        embed: true
        codeSign: true
      # Closure completion -- see the note in AgenticDeveloperHubSDKLanguageTests.
      - target: AgenticDeveloperHubSDKMacOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKScripting
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKCoreMacOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKCoreUI
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKCore
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDK-macOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKUI-macOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKMarkdown-macOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKPermissions
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKPermissionsUI
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKDisplays
        embed: true
        codeSign: true
      - target: AIPluginKit
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKLanguage
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKDatabase
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKSync
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKSyncGRDB
        embed: true
        codeSign: true
      - package: GRDB
        product: GRDB
      # AgenticDeveloperHubSDKMacOS links Sparkle (AppUpdater); the test bundle loads
      # its frameworks out of its own Frameworks directory, so Sparkle has to
      # be there too — same "closure completion" reason as GRDB above.
      - package: Sparkle
        product: Sparkle
      # AgenticDeveloperHubSDKMacOS links FlyingFox (MCPHTTPEndpoint); same closure
      # completion as Sparkle above.
      - package: FlyingFox
        product: FlyingFox

  AgenticDeveloperHubSDKDatabase:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    # iOS safety rests on the `#if canImport(AgenticDeveloperHubSDKCore)` guard that
    # opens every file under Database/Daemon, not on the destinationFilters
    # below: XcodeGen emits no per-source filter for them, so the iOS slice
    # compiles those files and the guard empties them. Do not remove the guard
    # (DaemonGuardTests fails if a file lacks it). A generic `-target ... iOS`
    # build of this framework is expected to fail (it tries to build Core for
    # iOS); build through the AgenticDeveloperHubSDKiOSAll scheme instead.
    sources:
      - Database
      - path: Database/Daemon
        destinationFilters: [macOS]
    dependencies:
      - package: GRDB
        product: GRDB
      - sdk: libsqlite3.tbd
      # Daemon stores (Database/Daemon) are macOS-only: they sit on Core and
      # AIPluginKit, neither of which builds for iOS.
      - target: AgenticDeveloperHubSDKCore
        destinationFilters: [macOS]
      - target: AIPluginKit
        destinationFilters: [macOS]
    settings:
      base:
        # macOS 26 is the minimum for every product (Database links
        # AgenticDeveloperHubSDKCore on macOS, and Core requires 26). A consumer still
        # building for macOS 14, such as ADHDaemon or adhubapp's ADHDPipeline,
        # is a bug in that consumer.
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Daemon-safe: a GRDB DatabasePool with deadline-ejection (progress_handler),
    # read/write reentrancy (read-your-writes), and per-lane stats. Foundation +
    # GRDB + system SQLite only; no AppKit.

  AgenticDeveloperHubSDKDatabaseTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticDeveloperHubSDKDatabaseTests
    dependencies:
      - target: AgenticDeveloperHubSDKDatabase
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKCore
        embed: true
        codeSign: true
      - target: AIPluginKit
        embed: true
        codeSign: true
      # Closure completion -- see the note in AgenticDeveloperHubSDKLanguageTests.
      - target: AgenticDeveloperHubSDK-macOS
        embed: true
        codeSign: true
      - package: GRDB
        product: GRDB

  AgenticDeveloperHubSDKLanguageTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticDeveloperHubSDKLanguageTests
    dependencies:
      - target: AgenticDeveloperHubSDKLanguage
        embed: true
        codeSign: true
      # A test bundle loads its frameworks out of its OWN Frameworks
      # directory, so everything those frameworks link has to be in there --
      # the whole transitive closure, not only what the tests `import`. These
      # bundles pass today because `xcodebuild test` sets
      # `DYLD_FRAMEWORK_PATH` to the build products directory, where every
      # framework happens to sit beside every other; run one `.xctest` any
      # other way -- `xctest` directly, or the bundle copied somewhere else --
      # and dyld fails naming a framework the tests never mention. `otool -L`
      # on each built binary, not this file's `dependencies:` lists, is the
      # authority for what each closure contains.
      - target: AgenticDeveloperHubSDKCore
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDK-macOS
        embed: true
        codeSign: true

  AgenticDeveloperHubSDKSync:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    sources:
      - Sync
    settings:
      base:
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Daemon-safe: the offline-sync engine + protocol seam (SyncStore/
    # SyncTransport/SyncTriggerSource). Foundation + Network only; no AppKit.

  AgenticDeveloperHubSDKSyncTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      # The plain folder scan above already picks up Fixtures/*.json as
      # individually-registered resources; an explicit `type: folder`
      # entry for the same path double-registers it (a folder reference
      # in Resources AND the three flat file copies). Flat copies only.
      - Tests/AgenticDeveloperHubSDKSyncTests
    dependencies:
      - target: AgenticDeveloperHubSDKSync
        embed: true
        codeSign: true

  AgenticDeveloperHubSDKSyncGRDB:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    sources:
      - SyncGRDB
    dependencies:
      - target: AgenticDeveloperHubSDKSync
      - target: AgenticDeveloperHubSDKDatabase
      - package: GRDB
        product: GRDB
      - sdk: libsqlite3.tbd
    settings:
      base:
        # macOS 26 is the minimum for every product (Database links
        # AgenticDeveloperHubSDKCore on macOS, and Core requires 26). A consumer still
        # building for macOS 14, such as ADHDaemon or adhubapp's ADHDPipeline,
        # is a bug in that consumer.
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    # Daemon-safe: SyncStore implementation on BoundedDatabase (WAL pool).

  # Semantic search, the Foundation half: the embedder protocol, task
  # prefixes, bundle manifest and stamp, vector maths (Accelerate), the
  # half-float codec, the device chunker and result fusion. No package
  # dependencies, so anything can depend on it. Spec:
  # docs/specs/ingredients/semantic-search.md.
  AgenticDeveloperHubSDKSemanticSearch:
    type: framework
    supportedDestinations: [macOS, iOS]
    templates:
      - SwiftLint
    sources:
      - SemanticSearch
    settings:
      base:
        SDKROOT: auto
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"

  AgenticDeveloperHubSDKSemanticSearchTests:
    type: bundle.unit-test
    platform: macOS
    templates:
      - SwiftLint
    sources:
      - Tests/AgenticDeveloperHubSDKSemanticSearchTests
    dependencies:
