        codeSign: true
      - target: AgenticDeveloperHubSDK-macOS
        embed: true
        codeSign: true
      - target: AgenticDeveloperHubSDKUI-macOS
        embed: true
        codeSign: true
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession

  # The hub's service layer — session, workspaces, adapters, transport — with
  # no UI. Split per platform because it depends on AgenticDeveloperHubSDKHub, which is.
  AgenticDeveloperHubSDKHubService-macOS:
    type: framework
    platform: macOS
    templates: [SwiftLint]
    sources:
      - path: HubService
        excludes: ["iOS"]
    dependencies:
      - target: AgenticDeveloperHubSDKHub-macOS
      - target: AgenticDeveloperHubSDKHubAuth-macOS
      - target: AgenticDeveloperHubSDKPermissions
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubClient
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubAuth
      # withDeadline: the bounded wait HubEnvironment resolves its transport
      # under lives in the bottom framework so every tier can share it.
      - target: AgenticDeveloperHubSDK-macOS
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      # HubEnvironment.swift calls APITransport.direct() with no transport
      # argument, which resolves to a default-parameter expression that
      # constructs URLSessionTransport() — that expression compiles into
      # THIS target's object code, so this target needs OpenAPIURLSession
      # directly, not just transitively through AgenticDeveloperHubClient.
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    settings:
      base:
        PRODUCT_NAME: AgenticDeveloperHubSDKHubService
        # Not 14.0 (the usual HTDV/Hub split-target floor): this target links
        # AgenticDeveloperHubSDKPermissions for HubPermissions.swift, and that
        # framework's own minimum is macOS 26.0 (no per-target override in its
        # target definition, so it inherits the project's base setting).
        # Matches the deployment target the app's own HubKit-macOS already
        # built this same code at before the move.
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  AgenticDeveloperHubSDKHubService-iOS:
    type: framework
    platform: iOS
    templates: [SwiftLint]
    sources:
      - path: HubService
        excludes: ["macOS"]
    dependencies:
      - target: AgenticDeveloperHubSDKHub-iOS
      - target: AgenticDeveloperHubSDKHubAuth-iOS
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubClient
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubAuth
      # See AgenticDeveloperHubSDKHubService-macOS: withDeadline.
      - target: AgenticDeveloperHubSDK-iOS
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      # See the same dependency on AgenticDeveloperHubSDKHubService-macOS above:
      # HubEnvironment.swift's APITransport.direct() default parameter
      # constructs URLSessionTransport() directly in this target's code.
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    settings:
      base:
        SDKROOT: iphoneos
        PRODUCT_NAME: AgenticDeveloperHubSDKHubService
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"

