  # A per-platform pair rather than one `supportedDestinations: [macOS, iOS]`
  # target, for the reason spelled out above AgenticDeveloperHubSDKMarkdown: this
  # framework depends on AgenticDeveloperHubSDKUI, which exposes only
  # platform-specific targets, and a multi-destination target cannot depend on a
  # single-platform one. Both halves build the same `HTDV` sources under the same
  # product name, so consumers still see one framework called AgenticDeveloperHubSDKHTDV.
  #
  # The dependency is what makes these views themeable: SemanticPalette,
  # ThemeRole, Themeable and ThemePaletteObserver all live in
  # AgenticDeveloperHubSDKUI. Before it, HTDV had no dependencies at all and so
  # had no vocabulary but NSColor's system colors, which is why every view in it
  # ignored the user's theme.
  AgenticDeveloperHubSDKHTDV-macOS:
    type: framework
    platform: macOS
    templates: [SwiftLint]
    sources:
      - HTDV
    dependencies:
      - target: AgenticDeveloperHubSDKUI-macOS
    settings:
      base:
        PRODUCT_NAME: AgenticDeveloperHubSDKHTDV
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  AgenticDeveloperHubSDKHTDV-iOS:
    type: framework
    platform: iOS
    templates: [SwiftLint]
    sources:
