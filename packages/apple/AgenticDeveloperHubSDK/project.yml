      - target: AgenticDeveloperHubSDKCoreMacOS
      - target: AgenticDeveloperHubSDKScripting
      - target: AgenticDeveloperHubSDKPermissions
      - target: AgenticDeveloperHubSDKPermissionsUI
      - target: AgenticDeveloperHubSDKUI-macOS
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubClient
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubAuth
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
    settings:
