        codeSign: true

  # The hub login, on its own: the session, the transports, the Keychain-backed
  # stores (through AgenticDeveloperHubAuth, the auth-only generated client),
  # HubAccount and the sign-in model. An app that wants only "sign in to the
  # hub" links this pair and never compiles the full client, the workspace
  # layer or HTDV. AgenticDeveloperHubSDKHub, HubService and HubUI build on it and
  # re-export it. Split per platform because AgenticDeveloperHubSDK is.
  AgenticDeveloperHubSDKHubAuth-macOS:
    type: framework
    platform: macOS
    templates: [SwiftLint]
    sources:
      - HubAuth
    dependencies:
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubAuth
      - target: AgenticDeveloperHubSDK-macOS
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
      - package: swift-http-types
        product: HTTPTypes
      # HubEnvironment.swift's APITransport.direct() default parameter
      # constructs URLSessionTransport() in this target's own code.
      - package: swift-openapi-urlsession
        product: OpenAPIURLSession
    settings:
      base:
        PRODUCT_NAME: AgenticDeveloperHubSDKHubAuth
        MACOSX_DEPLOYMENT_TARGET: "26.0"

  AgenticDeveloperHubSDKHubAuth-iOS:
    type: framework
    platform: iOS
    templates: [SwiftLint]
    sources:
      - HubAuth
    dependencies:
      - target: AgenticDeveloperHubClient/AgenticDeveloperHubAuth
      - target: AgenticDeveloperHubSDK-iOS
      - package: swift-openapi-runtime
        product: OpenAPIRuntime
