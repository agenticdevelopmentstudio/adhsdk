packages:
  - './packages/*'
  - './packages/features/*'

# Security floors for packages that arrive transitively, each raised to the
# first release that clears an open Dependabot alert. Mirrored in package.json's
# "pnpm.overrides" because pnpm 9 — the version pinned in packageManager — reads
# it there, while pnpm 10+ reads it here. Drop an entry once every dependent
# resolves that package above the floor on its own. minimatch 11 is CJS-named
# only, so @redocly/openapi-core's default-call require is patched (patches/).
overrides:
  vite: ^8.2.4
  esbuild: ^0.28.1
  dompurify: ^3.4.17
  "@modelcontextprotocol/sdk": ^1.32.0
  "body-parser@2": ^2.4.0
  "brace-expansion@5": ^5.0.12
  "js-yaml@3": ^3.15.2
  postcss: ^8.5.23
  source-map-js: ^1.2.2
  "undici@7": ^7.30.1
  fast-uri: ^3.1.9
  ip-address: ^10.7.4
  qs: ^6.16.1
  "next@15": ^15.5.28
  "@vitest/mocker": ^4.1.12
  minimatch: ^11.0.1
  "glob@>=9 <14.0.2": ^14.0.2
  "@types/react": 19.2.18

# pnpm deploy of a closure without @redocly/openapi-core must not fail on its patch.
allowUnusedPatches: true

patchedDependencies:
  "@redocly/openapi-core@1.34.20": patches/@redocly__openapi-core@1.34.20.patch
